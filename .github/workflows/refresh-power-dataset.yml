name: Refresh power dataset

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh dataset
        run: python scripts/refresh-power-dataset.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/MeterSimulator/Data/power-data-current-month.json src/MeterSimulator/Data/current-month.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh power dataset to next real month"
            git push
          fi
