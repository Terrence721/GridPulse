name: CodeQL

# csharp runs now that real .cs source exists (ServiceDefaults, AppHost); actions
# analyzes this repo's own workflow YAML; javascript-typescript runs now that
# real JS/TS source exists (Phase 3's Notification Service) — CodeQL's JS/TS
# extractor hard-fails database finalize when zero matching files are found,
# it does not just report zero findings the way build-mode: none does for a
# language that does have matching files present, which is why this was
# deliberately left out until now.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@v6

      - name: Install Aspire CLI
        if: matrix.build-mode == 'manual'
        # AppHost's SDK requires the Aspire CLI bundle to build (ASPIRE009) and hosted
        # runners don't have it. Pinned to match the Aspire.Hosting.* package version.
        # The script detects $GITHUB_ACTIONS and appends its install dir to $GITHUB_PATH
        # itself, so no manual PATH wiring is needed here.
        run: curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.5.4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build GridPulse.slnx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
