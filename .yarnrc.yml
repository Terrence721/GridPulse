nodeLinker: node-modules

# Centralized dependency versions shared across every JS/TS package in this
# monorepo (Notification Service, React dashboard, tooling). Reference a
# pinned version from any workspace package.json with the `catalog:` protocol
# (or `catalog:<name>` for an entry under `catalogs:`) instead of hardcoding
# a version per package. Populated as each package is actually added — see
# the GridPulse wiki's Foundation section.
catalog:
  kafkajs: 2.2.4
  "@kafkajs/confluent-schema-registry": 4.1.0
  typescript: 7.0.2
  tsx: 4.23.13
  vitest: 5.0.0
  "@types/node": 26.5.1
catalogs: {}
